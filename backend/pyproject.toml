[tool.poetry]
name = "meta-analysis-tool"
version = "0.1.0"
description = "AI-powered meta-analysis research platform using specialized agents"
authors = ["Your Name"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
anthropic = "^0.18.1"
langchain = "^0.1.9"
langgraph = "^0.0.25"
sqlalchemy = "^2.0.23"
chromadb = "^0.4.22"
scipy = "^1.11.4"
pandas = "^2.1.4"
pymupdf = "^1.23.8"
spacy = "^3.7.2"
httpx = "^0.26.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.3"
black = "^23.12.1"
mypy = "^1.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=app --cov-report=html --cov-report=term"
