[pytest]
# Pytest configuration for meta-analysis-tool

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.9

# Add options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Warnings
    --strict-config
    --tb=short
    # Coverage (when --cov flag is used)
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    # Async support
    --asyncio-mode=auto
    # Performance
    --durations=10

# Markers for organizing tests
markers =
    validation: validation tests against gold standards (slow)
    performance: performance and load tests
    integration: integration tests requiring external services
    slow: slow running tests (> 1 second)
    security: security and authentication tests
    unit: unit tests (fast, isolated)
    e2e: end-to-end tests
    smoke: smoke tests for quick validation

# Ignore directories
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    htmlcov

# Async settings
asyncio_mode = auto

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (prevent hanging)
timeout = 300
timeout_method = thread

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Coverage settings (when using --cov)
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
