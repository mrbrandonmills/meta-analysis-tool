name: E2E Tests (Playwright)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run E2E tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  e2e-tests:
    name: E2E Tests - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd tests/e2e
          npm ci || npm install
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Set test environment variables
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "PLAYWRIGHT_TEST_BASE_URL=${{ secrets.PRODUCTION_FRONTEND_URL }}" >> $GITHUB_ENV
            echo "PLAYWRIGHT_API_URL=${{ secrets.PRODUCTION_API_URL }}" >> $GITHUB_ENV
          else
            echo "PLAYWRIGHT_TEST_BASE_URL=${{ secrets.STAGING_FRONTEND_URL }}" >> $GITHUB_ENV
            echo "PLAYWRIGHT_API_URL=${{ secrets.STAGING_API_URL }}" >> $GITHUB_ENV
          fi

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for ${{ env.PLAYWRIGHT_TEST_BASE_URL }} to be ready..."
          timeout 300 bash -c 'until curl -f -s -o /dev/null ${{ env.PLAYWRIGHT_TEST_BASE_URL }}; do sleep 5; done' || {
            echo "Deployment not ready after 5 minutes"
            exit 1
          }

      - name: Run E2E tests
        run: |
          cd tests/e2e
          npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ env.PLAYWRIGHT_TEST_BASE_URL }}
          PLAYWRIGHT_API_URL: ${{ env.PLAYWRIGHT_API_URL }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 30

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-${{ matrix.browser }}-${{ matrix.shard }}
          path: tests/e2e/test-results/**/*.webm
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ matrix.browser }}-${{ matrix.shard }}
          path: tests/e2e/test-results/**/*.png
          retention-days: 7

  e2e-mobile:
    name: E2E Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        device: ['Mobile Chrome', 'Mobile Safari']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd tests/e2e
          npm ci || npm install
          npx playwright install --with-deps chromium webkit

      - name: Run mobile E2E tests
        run: |
          cd tests/e2e
          npx playwright test --project="${{ matrix.device }}"
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.STAGING_FRONTEND_URL }}

      - name: Upload mobile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-${{ matrix.device }}
          path: tests/e2e/playwright-report/
          retention-days: 30

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd tests/e2e
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run accessibility tests with axe-core
        run: |
          cd tests/e2e
          npx playwright test --grep @accessibility
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.STAGING_FRONTEND_URL }}

      - name: Upload accessibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-results
          path: tests/e2e/accessibility-report/
          retention-days: 30

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd tests/e2e
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun --collect.url=${{ secrets.STAGING_FRONTEND_URL }} || true

      - name: Run performance tests
        run: |
          cd tests/e2e
          npx playwright test --grep @performance
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.STAGING_FRONTEND_URL }}

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            .lighthouseci/
            tests/e2e/performance-report/
          retention-days: 30

  e2e-report:
    name: Generate E2E Report
    needs: [e2e-tests, e2e-mobile]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Merge Playwright reports
        run: |
          npx playwright merge-reports --reporter html ./all-results > merged-report.html || true

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-merged-report
          path: merged-report.html
          retention-days: 30

      - name: Post summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = `## E2E Test Results\n\nE2E tests completed. Check artifacts for detailed reports.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  notify-on-failure:
    name: Notify on E2E Failure
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Send notification
        run: |
          echo "E2E tests failed on main branch"
          # Add Slack/Discord/Email notification here
